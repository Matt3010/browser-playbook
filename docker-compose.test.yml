# Test stack used by `make verify`. It is a self-contained environment: its own
# project name, its own volumes and the internal `test-web` application, so it can
# run next to the development stack without interfering with it.
name: browser-automation-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: browser_automation_test
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d browser_automation_test"]
      interval: 3s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 20

  test-web:
    build:
      context: .
      dockerfile: docker/test-web/Dockerfile
    environment:
      TEST_WEB_PORT: 3001
      LOG_LEVEL: warn
    ports:
      # Published so the e2e suite can reset/inspect the fake app state.
      - "${TEST_WEB_PUBLIC_PORT:-3901}:3001"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    command: >
      sh -c "cd packages/database
      && node_modules/.bin/prisma migrate deploy
      && node_modules/.bin/ts-node prisma/seed.ts"
    environment:
      DATABASE_URL: postgresql://app:test_password@postgres:5432/browser_automation_test
      SEED_USER_EMAIL: test@example.com
      SEED_USER_PASSWORD: TestPassword123!
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://app:test_password@postgres:5432/browser_automation_test
      REDIS_URL: redis://redis:6379
      JWT_SECRET: test_jwt_secret_value_for_verify
      CREDENTIALS_ENC_KEY: 0123456789abcdef0123456789abcdef
      SESSION_TOKEN_TTL_SECONDS: 1800
      WORKER_URL: http://worker:5000
      BROWSER_SESSION_TIMEOUT_MS: 300000
      # test-web lives on a private network name, so it must be reachable.
      ALLOW_PRIVATE_TARGETS: "true"
      ALLOWED_TARGET_HOSTS: test-web
      ARTIFACT_DIR: /data/artifacts
      COOKIE_SECURE: "false"
      RATE_LIMIT_MAX: "5000"
      REGISTER_RATE_LIMIT_MAX: "5000"
      LOGIN_RATE_LIMIT_MAX: "5000"
      LOG_LEVEL: info
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: docker/browser/Dockerfile
    environment:
      NODE_ENV: production
      WORKER_PORT: 5000
      DATABASE_URL: postgresql://app:test_password@postgres:5432/browser_automation_test
      REDIS_URL: redis://redis:6379
      CREDENTIALS_ENC_KEY: 0123456789abcdef0123456789abcdef
      WORKER_MAX_SESSIONS: 4
      BROWSER_SESSION_TIMEOUT_MS: 300000
      DISPLAY_RANGE_START: 100
      DISPLAY_RANGE_END: 199
      VNC_PORT_RANGE_START: 15900
      VNC_PORT_RANGE_END: 15999
      ALLOW_PRIVATE_TARGETS: "true"
      ALLOWED_TARGET_HOSTS: test-web
      ARTIFACT_DIR: /data/artifacts
      UPLOAD_FIXTURE_DIR: /opt/upload-fixtures
      LOG_LEVEL: info
    shm_size: 1gb
    volumes:
      - artifacts:/data/artifacts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      test-web:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  reverse-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/nginx-health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 20

networks:
  internal:
    driver: bridge

volumes:
  artifacts:
