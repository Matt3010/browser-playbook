worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile on;
  tcp_nodelay on;
  server_tokens off;

  log_format main '$remote_addr - $status "$request" ${upstream_response_time}s';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Docker's embedded DNS. Combined with the variables below this makes nginx
    # re-resolve upstream names at request time, so restarting a container (which
    # changes its IP) does not leave the proxy pointing at a dead address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $api_target "api:4000";
    set $web_target "web:3000";

    # Only the web UI and the API are reachable from outside. Postgres, Redis
    # and the per-session VNC ports stay on the internal Docker network.
    location /api/ {
      proxy_pass http://$api_target$request_uri;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # noVNC WebSocket upgrade.
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # Long-lived streams: SSE logs and the VNC socket must not be buffered
      # or cut off by a read timeout.
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /health {
      proxy_pass http://$api_target/health;
      proxy_set_header Host $host;
    }

    location = /ready {
      proxy_pass http://$api_target/ready;
      proxy_set_header Host $host;
    }

    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://$web_target$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
